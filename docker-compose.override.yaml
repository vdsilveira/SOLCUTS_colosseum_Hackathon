# Tor HTTP Proxy sidecar para contornar bloqueio de IP do YouTube
# O Docker Compose faz merge automático deste arquivo com docker-compose.yaml

services:
  tor-proxy:
    image: zhaowde/rotating-tor-http-proxy:latest
    container_name: solcuts-tor-proxy
    restart: unless-stopped
    environment:
      - TOR_INSTANCES=10
      - TOR_REBUILD_INTERVAL=1800
      - TOR_EXIT_COUNTRY=us

  oracle:
    depends_on:
      tor-proxy:
        condition: service_started
    environment:
      - HTTP_PROXY=http://tor-proxy:3128
      - HTTPS_PROXY=http://tor-proxy:3128
      - http_proxy=http://tor-proxy:3128
      - https_proxy=http://tor-proxy:3128
      - NO_PROXY=localhost,127.0.0.1,api.devnet.solana.com,solana-devnet.infura.io,backend-views-solana.onrender.com,.local
